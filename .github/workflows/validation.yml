name: Linux data-plane conformance
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  console-kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/artifacts/playwright
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: PicketX/PicketX
          ref: c67da10767d5cb92012366b6328baa31be8afa61
          path: .ci-core
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .ci-core/.node-version
          cache: npm
          cache-dependency-path: .ci-core/apps/web/package-lock.json
      - name: Locked real management Web build
        working-directory: .ci-core/apps/web
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run build
          npx playwright install --with-deps chromium
      - name: Install existing ingress test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx libnss3-tools musl-tools
      - name: Download and verify pinned real Gitea
        run: |
          mkdir -p artifacts
          curl --fail --location --retry 3 --output artifacts/gitea https://github.com/go-gitea/gitea/releases/download/v28.2.0/gitea-28.2.0-linux-amd64
          echo '15681fc615d56611c274f52803fef4d6d5316b620f93b677dd4b831a74e50b9f  artifacts/gitea' | sha256sum --check --strict
          chmod 755 artifacts/gitea
          artifacts/gitea --version
      - name: Real browser API gRPC kernel ingress application conjunction
        env:
          PICKETX_CONSOLE_KERNEL_TESTS: '1'
        run: scripts/test-console-kernel.sh "$PWD/.ci-core"
      - name: Actual Controller-mode Agent systemd outage and LKG recovery
        run: sudo --non-interactive env PICKETX_CONTROLLER_SERVICE_TESTS=1 python3 -B scripts/test-controller-service.py --binary "$PWD/artifacts/picketxd-console" --controller-bundle "$PWD/artifacts/controller-bundle" --artifacts "$PWD/artifacts/console-kernel" --unit "$PWD/deploy/systemd/picketxd-controller.service"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify pinned real OIDC provider distribution
        run: |
          curl -fsSL --retry 3 https://github.com/keycloak/keycloak/releases/download/26.8.1/keycloak-26.8.1.tar.gz -o "$RUNNER_TEMP/keycloak.tar.gz"
          echo "4e2740b181faa2ea623a1c2ecf00855935311e546046e2f857615a47ed24cbe8  $RUNNER_TEMP/keycloak.tar.gz" | sha256sum --check --strict -
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/keycloak.tar.gz"
      - name: Real OIDC HTTPS humans installed Agent ingress application conjunction
        run: |
          sudo --non-interactive env PATH="$PATH" JAVA_HOME="$JAVA_HOME" GITHUB_ACTIONS="$GITHUB_ACTIONS" \
            PLAYWRIGHT_BROWSERS_PATH="$PLAYWRIGHT_BROWSERS_PATH" PICKETX_CONSOLE_KERNEL_TESTS=1 \
            unshare --net -- node "$PWD/integration/oidc-conjunction.mjs" "$PWD/.ci-core" "$RUNNER_TEMP/keycloak-26.8.1"
      - name: Print native conjunction report and sanitized process logs
        if: always()
        run: |
          for file in artifacts/console-kernel/report.json artifacts/console-kernel/*.log; do
            if test -f "$file"; then cat "$file"; fi
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: console-kernel-evidence
          path: artifacts/console-kernel/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: installed-controller-bundle
          path: |
            artifacts/installed-controller.tar.gz
            artifacts/installed-controller.tar.gz.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: installed-agent-bundle
          path: |
            artifacts/agent-distribution/installed-agent.tar.gz
            artifacts/agent-distribution/installed-agent.tar.gz.sha256
            artifacts/agent-distribution/proof.json
            artifacts/agent-distribution/agent-build.txt
            artifacts/agent-distribution/rebuilt-build.txt
            artifacts/agent-distribution/offline-go.log
          if-no-files-found: error
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -count=1 -v ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./...
      - name: Static preparation binary and restart smoke
        run: scripts/test-prepare.sh
      - name: Offline systemd unit verification
        run: scripts/verify-systemd.sh
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true
      - name: Real isolated kernel scenarios and evidence gate
        env:
          PICKETX_KERNEL_TESTS: '1'
        run: scripts/test-kernel.sh
      - name: Real isolated systemd service lifecycle
        run: sudo --non-interactive env PICKETX_SYSTEMD_TESTS=1 python3 scripts/test-systemd.py --binary "$PWD/artifacts/picketxd" --artifacts "$PWD/artifacts"
      - name: Print native evidence metadata and report
        if: always()
        run: |
          cat artifacts/kernel.txt artifacts/go.txt artifacts/modules.txt artifacts/agent-binary.txt
          cat artifacts/report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: kernel-evidence
          path: |
            artifacts/*.json
            artifacts/*.txt
          if-no-files-found: error
