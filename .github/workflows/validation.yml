name: Linux data-plane conformance
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  console-kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/artifacts/playwright
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: PicketX/PicketX
          ref: 31c7ac762ca0ea7d2d06ee2b30cb511c161cdad1
          path: .ci-core
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .ci-core/.node-version
          cache: npm
          cache-dependency-path: .ci-core/apps/web/package-lock.json
      - name: Locked real management Web build
        working-directory: .ci-core/apps/web
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run build
          npx playwright install --with-deps chromium
      - name: Install existing ingress test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx
      - name: Real browser API gRPC kernel ingress application conjunction
        env:
          PICKETX_CONSOLE_KERNEL_TESTS: '1'
        run: scripts/test-console-kernel.sh "$PWD/.ci-core"
      - name: Print native conjunction report and sanitized process logs
        if: always()
        run: |
          for file in artifacts/console-kernel/report.json artifacts/console-kernel/*.log; do
            if test -f "$file"; then cat "$file"; fi
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: console-kernel-evidence
          path: artifacts/console-kernel/
          if-no-files-found: error
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -count=1 -v ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./...
      - name: Static preparation binary and restart smoke
        run: scripts/test-prepare.sh
      - name: Offline systemd unit verification
        run: scripts/verify-systemd.sh
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true
      - name: Real isolated kernel scenarios and evidence gate
        env:
          PICKETX_KERNEL_TESTS: '1'
        run: scripts/test-kernel.sh
      - name: Real isolated systemd service lifecycle
        run: sudo --non-interactive env PICKETX_SYSTEMD_TESTS=1 python3 scripts/test-systemd.py --binary "$PWD/artifacts/picketxd" --artifacts "$PWD/artifacts"
      - name: Print native evidence metadata and report
        if: always()
        run: |
          cat artifacts/kernel.txt artifacts/go.txt artifacts/modules.txt artifacts/agent-binary.txt
          cat artifacts/report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: kernel-evidence
          path: |
            artifacts/*.json
            artifacts/*.txt
          if-no-files-found: error
